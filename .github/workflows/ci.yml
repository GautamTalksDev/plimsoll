name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.25"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Build browser verifier WASM
        if: runner.os == 'Linux'
        run: bash scripts/build-wasm.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          args: --timeout=5m

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # govulncheck reports only vulnerabilities reachable from this code, so a
      # It reports only vulnerabilities reachable from this code, unlike a
      # manifest scan, so a failure here is a real finding rather than noise.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Run govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      # The submit Worker's dependencies are development-only, but they run on
      # a maintainer machine with a deploy token, so a compromise there is a
      # supply-chain compromise of the log.
      - name: npm audit (submit worker)
        working-directory: workers/submit
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Test Python wrapper
        run: |
          go build -trimpath -o /tmp/plimsoll ./cmd/plimsoll
          cd python
          python -m venv .venv
          .venv/bin/pip install -e ".[pytest]"
          PLIMSOLL_BINARY=/tmp/plimsoll .venv/bin/python -m pytest tests/ -v
