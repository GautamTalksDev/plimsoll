version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - staticcheck
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # Tests intentionally exec binaries, write fixtures, and ignore some errors.
      - path: _test\.go
        linters: [errcheck, gosec]
	# The CLI and static generator open caller-chosen paths by design.
      - path: ^(cmd/plimsoll|cmd/plimsoll-static|cmd/plimsoll-append|internal/(datasetload|sealfile|keys|evidence|staticlog|logappend))/
        text: "G304"
        linters: [gosec]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
