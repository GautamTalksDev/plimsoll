version: 2

project_name: plimsoll

builds:
  - id: plimsoll
    main: ./cmd/plimsoll
    binary: plimsoll
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
  - id: plimsolld
    main: ./cmd/plimsolld
    binary: plimsolld
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: binary
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

release:
  prerelease: auto

changelog:
  disable: true

brews:
  - name: plimsoll
    repository:
      owner: gautamtalksdev
      name: homebrew-plimsoll
    directory: Formula
    homepage: "https://github.com/GautamTalksDev/plimsoll"
    description: "Verify evaluations you ran with your own tools"
    license: Apache-2.0
    install: |
      bin.install "plimsoll"
    test: |
      system "#{bin}/plimsoll", "--help"

scoops:
  - name: plimsoll
    repository:
      owner: gautamtalksdev
      name: scoop-plimsoll
    homepage: "https://github.com/GautamTalksDev/plimsoll"
    description: "Verify evaluations you ran with your own tools"
    license: Apache-2.0
