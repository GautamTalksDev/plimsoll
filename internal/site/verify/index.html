<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLIMSOLL browser verifier</title>
<link rel="stylesheet" href="verify.css">
</head>
<body>
<h1>PLIMSOLL browser verifier</h1>
<p class="privacy"><strong>Your attestation never leaves this browser.</strong> Verification runs locally in WebAssembly. We do not upload your file, and this page loads no third-party scripts, fonts, or analytics.</p>

<label for="att">Attestation JSON (paste or drop file)</label>
<textarea id="att" placeholder='Paste attestation JSON, plimsoll-attest-v1 envelope, or verification bundle…'></textarea>
<input type="file" id="att-file" accept=".json,application/json">

<label for="bundle">Offline bundle (optional — zero network requests)</label>
<textarea id="bundle" placeholder="plimsoll-verify-bundle-v1 JSON (optional)"></textarea>
<input type="file" id="bundle-file" accept=".json,application/json">

<label for="log">Transparency log URL (Rule 9: any PLIMSOLL log)</label>
<input type="text" id="log" placeholder="https://log.example.com">

<button id="run" disabled>Verify</button>
<p id="status"></p>
<div id="verdict"></div>
<div id="disclosure"></div>
<table id="checks"><thead><tr><th>Check</th><th>Result</th><th>Detail</th></tr></thead><tbody></tbody></table>

<script src="wasm_exec.js"></script>
<script src="verify.js"></script>
</body>
</html>
