# Append one seal or attestation to the public Plimsoll Log.
#
# Trust boundary: this workflow validates the payload. The Cloudflare Worker
# is only a rate limiter / shape check. Anyone with LOG_DISPATCH_TOKEN can
# hit repository_dispatch directly — never trust the Worker alone.
#
# client_payload.submit must be the exact JSON body that logd /submit accepts
# (seal publish or attestation publish allowlist).

name: Append

on:
  repository_dispatch:
    types: [plimsoll-submit]

concurrency:
  group: plimsoll-log-append
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Pin to a GautamTalksDev/plimsoll release that ships plimsoll-append and
  # plimsoll-static. Bump deliberately after verifying the release with cosign.
  PLIMSOLL_RELEASE: v0.1.0
  PLIMSOLL_REPO: GautamTalksDev/plimsoll
  BASE_URL: https://plimsoll.gautamkhosla.com

jobs:
  append:
    name: append
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install plimsoll-append and plimsoll-static
        env:
          TAG: ${{ env.PLIMSOLL_RELEASE }}
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/plimsoll-tools"
          mkdir -p "${DEST}"
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch: ${ARCH}" >&2; exit 1 ;;
          esac
          for BIN in plimsoll-append plimsoll-static; do
            NAME="${BIN}_${TAG}_linux_${ARCH}"
            URL="https://github.com/${PLIMSOLL_REPO}/releases/download/${TAG}/${NAME}"
            curl -fsSL "${URL}" -o "${DEST}/${BIN}"
            curl -fsSL "${URL}.sigstore.json" -o "${DEST}/${NAME}.sigstore.json"
            cosign verify-blob \
              --new-bundle-format \
              --bundle "${DEST}/${NAME}.sigstore.json" \
              --certificate-identity-regexp "https://github.com/${PLIMSOLL_REPO}/.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${DEST}/${BIN}"
            chmod 0755 "${DEST}/${BIN}"
          done
          echo "${DEST}" >> "${GITHUB_PATH}"

      - name: Write submit payload
        run: |
          set -euo pipefail
          if ! jq -e '.client_payload.submit != null' "${GITHUB_EVENT_PATH}" >/dev/null; then
            echo "client_payload.submit is required" >&2
            exit 1
          fi
          OUT="${RUNNER_TEMP}/submit.json"
          # Write via jq so attacker-controlled JSON never reaches an eval'd shell string.
          if jq -e '(.client_payload.submit | type) == "string"' "${GITHUB_EVENT_PATH}" >/dev/null; then
            jq -r '.client_payload.submit' "${GITHUB_EVENT_PATH}" > "${OUT}"
          else
            jq -c '.client_payload.submit' "${GITHUB_EVENT_PATH}" > "${OUT}"
          fi
          chmod 600 "${OUT}"
          BYTES="$(wc -c < "${OUT}" | tr -d ' ')"
          if [[ "${BYTES}" -gt 1048576 ]]; then
            echo "submit payload exceeds 1 MiB" >&2
            exit 1
          fi
          echo "wrote submit payload (${BYTES} bytes)"

      - name: Materialize signing key
        env:
          LOG_SIGNING_KEY_B64: ${{ secrets.LOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${LOG_SIGNING_KEY_B64}" ]]; then
            echo "LOG_SIGNING_KEY secret is empty" >&2
            exit 1
          fi
          KEY_FILE="${RUNNER_TEMP}/log-signing.key"
          # Secret is standard base64 of the 64 raw Ed25519 private key bytes.
          printf '%s' "${LOG_SIGNING_KEY_B64}" | base64 -d > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          BYTES="$(wc -c < "${KEY_FILE}" | tr -d ' ')"
          if [[ "${BYTES}" != "64" ]]; then
            echo "LOG_SIGNING_KEY must decode to 64 bytes (got ${BYTES})" >&2
            rm -f "${KEY_FILE}"
            exit 1
          fi
          echo "KEY_FILE=${KEY_FILE}" >> "${GITHUB_ENV}"
          echo "APPEND_OUT=${RUNNER_TEMP}/append.out" >> "${GITHUB_ENV}"

      - name: Validate and append
        run: |
          set -euo pipefail
          plimsoll-append \
            -db log.sqlite \
            -key "${KEY_FILE}" \
            -public keys/log-public.pem \
            -payload "${RUNNER_TEMP}/submit.json" \
            -out "${APPEND_OUT}"

      - name: Regenerate static tree
        run: |
          set -euo pipefail
          rm -rf public
          plimsoll-static \
            -db log.sqlite \
            -out public \
            -key keys/log-public.pem \
            -base-url "${BASE_URL}"

      - name: Commit and push
        run: |
          set -euo pipefail
          # Build commit message only from machine fields. Never interpolate
          # seal names, supersede reasons, or other attacker-controlled text.
          KIND="$(sed -n 's/^KIND=//p' "${APPEND_OUT}" | head -n1)"
          HASH="$(sed -n 's/^HASH=//p' "${APPEND_OUT}" | head -n1)"
          IDX="$(sed -n 's/^IDX=//p' "${APPEND_OUT}" | head -n1)"
          case "${KIND}" in
            seal|attestation) ;;
            *) echo "invalid KIND" >&2; exit 1 ;;
          esac
          echo "${HASH}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "${IDX}" | grep -Eq '^[0-9]+$'
          MSG="append: ${KIND} ${HASH} idx=${IDX}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log.sqlite public
          # Never stage key material from the runner temp dir.
          if git diff --cached --quiet; then
            echo "no changes to commit" >&2
            exit 1
          fi
          git commit -m "${MSG}"
          git push

      - name: Wipe signing key
        if: always()
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/log-signing.key"
          rm -f "${RUNNER_TEMP}/submit.json"
          rm -f "${RUNNER_TEMP}/append.out"
